<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>퀵 배송비 조회 | NOTHINGMATTERS</title>
  <link rel="stylesheet" href="/assets/dashboard.css">
  <link rel="stylesheet" href="/dashboard/quick/quick.css">
  <script src="/dashboard/quick/quick.js" defer></script>
</head>
<body class="quick-admin quick-public">
  <main class="dashboard-wrap quick-page">
    <header class="quick-header">
      <a class="quick-back" href="/">← NOTHINGMATTERS</a>
      <div class="quick-title-row"><p class="dashboard-kicker">KAKAO T QUICK</p><span class="quick-badge" id="environmentBadge">SANDBOX</span></div>
      <h1>퀵 배송비 조회</h1>
      <p class="dashboard-lead">배송지 주소를 입력하면 예상 퀵비와 배송시간을 확인할 수 있어요.</p>
      <p id="setupStatus" class="quick-notice" role="status">조회 준비 중입니다.</p>
    </header>
    <div class="quick-layout">
      <section class="quick-card" aria-labelledby="formTitle">
        <h2 id="formTitle">어디로 보내시나요?</h2>
        <div class="quick-pickup" aria-label="출발지"><span>출발지</span><strong id="pickupName">NOTHINGMATTERS</strong><p id="pickupAddress">서울특별시 강서구 송정로 25 1층</p></div>
        <form id="quickForm">
          <fieldset id="formFields" disabled>
            <legend class="sr-only">배송비 조회 정보</legend>
            <label>배송지 주소 *<input id="basicAddress" name="basicAddress" required maxlength="200" autocomplete="street-address" placeholder="예: 서울특별시 강남구 테헤란로 123"></label>
            <label>상세주소<input id="detailAddress" name="detailAddress" maxlength="200" autocomplete="address-line2" placeholder="예: 5층 / 101호"></label>
            <div class="quick-input-grid">
              <label>배송 종류<select id="orderType" name="orderType"><option value="QUICK" selected>일반 퀵</option><option value="QUICK_ECONOMY">이코노미</option><option value="QUICK_EXPRESS">급송</option></select></label>
              <label>포장 크기<select id="productSize" name="productSize"><option value="XS">XS · 초소형</option><option value="S" selected>S · 소형</option><option value="M">M · 중형</option></select><small>대형 배송은 차량 지정이 필요해 별도 상담으로 안내합니다.</small></label>
            </div>
            <button class="quick-button quick-button--blue" id="quoteButton" type="submit">배송비·예상시간 조회</button>
          </fieldset>
        </form>
      </section>
      <aside class="quick-summary quick-card" aria-labelledby="summaryTitle">
        <p class="dashboard-kicker">DELIVERY PREVIEW</p><h2 id="summaryTitle">예상 배송 정보</h2>
        <dl class="quick-result"><div><dt>예상 퀵비</dt><dd id="estimatedPrice">조회 전</dd></div><div id="priceRangeRow" hidden><dt>예상 요금 범위</dt><dd id="priceRange"></dd></div><div><dt>예상 배송시간</dt><dd id="estimatedTime">조회 전</dd></div></dl>
        <p id="quoteBasis" class="quick-help">일반 퀵 · 소형(S) 기준</p>
        <p id="resultAddress" class="quick-destination" hidden></p>
        <p class="quick-help quick-price-note">조회 시점 기준 예상 요금이며 실제 배차 시 달라질 수 있습니다.</p>
        <p id="actionStatus" class="quick-action-status" role="status" aria-live="polite"></p>
      </aside>
    </div>
  </main>
</body>
</html>
